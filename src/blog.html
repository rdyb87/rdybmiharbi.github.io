<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adib_Ibrahim</title>
  <meta name="description" content="Full Stack Developer transforming ideas into reality">
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body class="bg-brandBg" x-data="{ mobileMenuOpen: false }">

<header class="bg-brandBg header-border sticky top-0 z-50" x-data="{ open: false }">
  <div class="container-custom py-4 flex justify-between items-center">
    
    <div class="px-5 py-1.5 border-2 border-brandDark rounded-full shadow-neo bg-white">
      <span class="font-extrabold text-xl tracking-tight">RdybMiharbi</span>
    </div>

    <nav class="hidden md:flex items-center space-x-8">
      <a href="/" class="font-bold text-sm uppercase tracking-widest text-brandDark">Home</a>
	  <a href="/blog.html" class="font-bold text-sm uppercase tracking-widest text-brandPurple">Blog</a>
      <a href="/about.html" class="font-bold text-sm uppercase tracking-widest text-gray-500 hover:text-brandDark">About</a>
	  <a href="/contact.html" class="font-bold text-sm uppercase tracking-widest text-gray-500 hover:text-brandDark">Contact</a>
      <div class="flex space-x-3 ml-4">
        <a href="#" class="icon-btn"> </a>
        <a href="#" class="icon-btn"> </a>
      </div>
    </nav>

    <button @click="open = !open" class="md:hidden p-2 border-2 border-brandDark rounded-lg bg-white shadow-neo">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
    </button>
  </div>
  
  <div x-show="open" class="md:hidden bg-brandBg border-t-2 border-brandDark p-6 space-y-4">
    <a href="#" class="block font-bold uppercase">Home</a>
    <a href="#" class="block font-bold uppercase">Portfolio</a>
  </div>
</header>

  <!-- Header -->
  <section class="py-16 bg-gray-50">
    <div class="container-custom">
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Blog</h1>
      <p class="text-xl text-gray-600">Thoughts, tutorials, and insights on development</p>
    </div>
  </section>

  <!-- Blog Listing -->
  <section class="py-12" x-data="blogListing">
    <div class="container-custom">
      <!-- Search and Filter -->
      <div class="mb-8 flex flex-col md:flex-row gap-4">
        <div class="flex-1">
          <input 
            type="text" 
            x-model="searchQuery"
            @input.debounce="search"
            placeholder="Search posts..." 
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500"
          >
        </div>
        
        <div class="flex gap-2 overflow-x-auto pb-2">
          <template x-for="category in categories" :key="category">
            <button 
              @click="filterByCategory(category)"
              :class="selectedCategory === category ? 'bg-gray-900 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'"
              class="px-4 py-2 rounded-lg border border-gray-300 whitespace-nowrap transition-colors font-medium capitalize"
              x-text="category"
            ></button>
          </template>
        </div>
      </div>

      <!-- Loading State -->
      <div x-show="loading" class="text-center py-20">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-primary-600"></div>
        <p class="mt-4 text-gray-600">Loading posts...</p>
      </div>

      <!-- Posts Grid -->
      <div x-show="!loading && filteredPosts.length > 0" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
        <template x-for="post in filteredPosts" :key="post.slug">
          <article class="card group cursor-pointer" @click="window.location.href = `/blog/${post.slug}.html`">
            <div class="aspect-video bg-gray-200 rounded-lg mb-4 overflow-hidden">
              <img :src="post.image" :alt="post.title" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-200">
            </div>
            
            <div class="flex items-center gap-2 mb-3">
              <span class="badge" x-text="post.category"></span>
              <span class="text-sm text-gray-500" x-text="post.date"></span>
            </div>
            
            <h3 class="text-xl font-bold mb-2 group-hover:text-primary-600 transition-colors" x-text="post.title"></h3>
            <p class="text-gray-600 mb-4" x-text="post.excerpt"></p>
            
            <div class="flex items-center text-sm text-gray-500">
              <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span x-text="post.readTime"></span>
            </div>
          </article>
        </template>
      </div>

      <!-- No Results -->
      <div x-show="!loading && filteredPosts.length === 0" class="text-center py-20">
        <svg class="w-16 h-16 mx-auto text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <h3 class="text-xl font-bold text-gray-900 mb-2">No posts found</h3>
        <p class="text-gray-600">Try adjusting your search or filter criteria</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 py-8 mt-20">
    <div class="container-custom">
      <div class="flex flex-col md:flex-row items-center justify-between">
        <p class="text-gray-600 text-sm">© 2026 rdybmiharbi. All rights reserved.</p>
        <div class="flex space-x-6 mt-4 md:mt-0">
          <a href="https://github.com/rdybmiharbi" target="_blank" class="text-gray-600 hover:text-gray-900">GitHub</a>
          <a href="https://linkedin.com/in/rdybmiharbi" target="_blank" class="text-gray-600 hover:text-gray-900">LinkedIn</a>
          <a href="https://twitter.com/rdybmiharbi" target="_blank" class="text-gray-600 hover:text-gray-900">Twitter</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
