              <path
                d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />

      <button @click="open = !open"
        class="md:hidden p-2 border-4 border-brandDark rounded-lg bg-white shadow-hard active:shadow-none active:translate-x-[2px] active:translate-y-[2px] transition-all">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">

        </svg>

    <div x-show="open" x-cloak class="md:hidden bg-white border-t-4 border-brandDark p-6 space-y-4 shadow-xl">
      <a href="/" class="block font-black uppercase text-xl hover:text-brandPurple">Home</a>
      <a href="/blog.html" class="block font-black uppercase text-xl hover:text-brandPurple">Blog</a>
      <a href="/about.html" class="block font-black uppercase text-xl hover:text-brandPurple">About</a>
      <a href="/contact.html" class="block font-black uppercase text-xl hover:text-brandPurple">Contact</a>
    </div>
  </header>

  <!-- Header -->
  <section class="py-20 bg-brandBg border-b-4 border-brandDark">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <h1 class="text-6xl md:text-8xl font-black mb-6 tracking-tighter text-brandDark">Blog</h1>
      <p class="text-2xl text-gray-600 font-medium max-w-2xl">Thoughts, tutorials, and insights on development, product,
        and leadership.</p>
    </div>
  </section>

  <!-- Blog Listing -->
  <section class="py-16 bg-white" x-data="blogListing">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <!-- Search and Filter -->
      <div class="mb-12 flex flex-col md:flex-row gap-6">
        <div class="flex-1">
          <input type="text" x-model="searchQuery" @input.debounce="search" placeholder="Search posts..."
            class="w-full px-6 py-4 border-4 border-brandDark rounded-xl focus:outline-none shadow-hard focus:shadow-none focus:translate-x-[2px] focus:translate-y-[2px] transition-all font-bold placeholder-gray-400">
        </div>

        <div class="flex gap-3 overflow-x-auto pb-4 md:pb-0">
          <template x-for="category in categories" :key="category">
            <button @click="filterByCategory(category)"
              :class="selectedCategory === category ? 'bg-brandPurple text-white shadow-none translate-x-[2px] translate-y-[2px]' : 'bg-white text-brandDark hover:bg-brandBg hover:shadow-hard-hover hover:-translate-y-1'"
              class="px-6 py-3 border-4 border-brandDark rounded-xl shadow-hard transition-all font-black uppercase tracking-wide whitespace-nowrap text-sm"
              x-text="category"></button>
          </template>
        </div>
      </div>

      <!-- Loading State -->
      <div x-show="loading" class="text-center py-24">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-brandDark border-t-brandPink">
        </div>
        <p class="mt-6 text-xl font-bold text-brandDark">Loading posts...</p>
      </div>

      <!-- Posts Grid -->
      <div x-show="!loading && filteredPosts.length > 0" class="grid md:grid-cols-2 lg:grid-cols-3 gap-10">
        <template x-for="post in filteredPosts" :key="post.slug">
          <article
            class="bg-white border-4 border-brandDark rounded-xl overflow-hidden hover:shadow-hard transition-all group cursor-pointer hover:-translate-y-1"
            @click="window.location.href = `/blog/${post.slug}.html`">
            <div class="aspect-video bg-gray-200 border-b-4 border-brandDark relative overflow-hidden">
              <img :src="post.image" :alt="post.title"
                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
              <div
                class="absolute top-4 left-4 px-3 py-1 bg-white border-2 border-brandDark rounded-full text-xs font-black uppercase z-10"
                x-text="post.category"></div>
            </div>

            <div class="p-6">
              <div class="flex items-center gap-3 mb-4">
                <span class="text-sm font-bold text-gray-500" x-text="post.date"></span>
                <span class="w-1 h-1 bg-brandDark rounded-full"></span>
                <span class="text-sm font-bold text-brandPurple flex items-center">
                  <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                      d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  <span x-text="post.readTime"></span>
                </span>
              </div>

              <h3 class="text-2xl font-black mb-3 group-hover:text-brandPurple leading-tight transition-colors"
                x-text="post.title"></h3>
              <p class="text-gray-600 mb-6 font-medium line-clamp-2" x-text="post.excerpt"></p>

              <span
                class="text-brandDark font-black text-sm uppercase tracking-wide group-hover:underline flex items-center gap-1">
                Read Article <span>→</span>
              </span>
            </div>
          </article>
        </template>
      </div>

      <!-- No Results -->
      <div x-show="!loading && filteredPosts.length === 0"
        class="text-center py-24 bg-brandBg border-4 border-brandDark rounded-xl shadow-hard">
        <svg class="w-20 h-20 mx-auto text-gray-400 mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <h3 class="text-3xl font-black text-brandDark mb-3">No posts found</h3>
        <p class="text-xl text-gray-600 font-medium">Try adjusting your search or filter criteria</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-white border-t-4 border-brandDark py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <p class="font-black text-brandDark text-lg">© 2026 RdybMiharbi. Built for greatness.</p>
    </div>
  </footer>
