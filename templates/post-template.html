<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - RdybMiharbi</title>
    <meta name="description" content="{{TITLE}}">
    <link rel="stylesheet" href="/css/style.css">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-[#fffdf5] text-slate-900 font-body selection:bg-violet-200">
    <!-- Navigation -->
    <nav class="container mx-auto px-6 py-6 flex items-center justify-between relative z-50" x-data="{ mobileMenuOpen: false }">
        <a href="/" class="text-2xl font-black text-slate-900 tracking-tighter border-4 border-slate-900 px-4 py-2 bg-white shadow-hard">
            Rdyb<span class="text-violet-500">Miharbi</span>
        </a>

        <!-- Desktop Menu -->
        <div class="hidden md:flex items-center space-x-8">
            <a href="/" class="font-bold text-slate-900 hover:text-violet-500 transition-colors">Home</a>
            <a href="/portfolio.html" class="font-bold text-slate-900 hover:text-violet-500 transition-colors">Portfolio</a>
            <a href="/blog.html" class="font-bold text-slate-900 text-violet-500">Blog</a>
            <a href="/contact.html" class="font-bold text-slate-900 hover:text-violet-500 transition-colors">Contact</a>

            <div class="flex items-center space-x-4 ml-4 pl-4 border-l-2 border-slate-200">
                <a href="https://github.com/rdybmiharbi" target="_blank" class="w-10 h-10 flex items-center justify-center bg-white border-2 border-slate-900 rounded-lg shadow-hard hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-none transition-all">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.041-1.416-4.041-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                </a>
                <a href="https://linkedin.com/in/rdybmiharbi" target="_blank" class="w-10 h-10 flex items-center justify-center bg-white border-2 border-slate-900 rounded-lg shadow-hard hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-none transition-all">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                </a>
            </div>
        </div>

        <!-- Mobile Menu Button -->
        <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden p-2 text-slate-900">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>

        <!-- Mobile Menu -->
        <div x-show="mobileMenuOpen" @click.away="mobileMenuOpen = false" class="absolute top-24 left-6 right-6 bg-white border-4 border-slate-900 rounded-2xl shadow-hard p-6 flex flex-col space-y-4 md:hidden">
            <a href="/" class="font-bold text-xl text-slate-900">Home</a>
            <a href="/portfolio.html" class="font-bold text-xl text-slate-900">Portfolio</a>
            <a href="/blog.html" class="font-bold text-xl text-slate-900 text-violet-500">Blog</a>
            <a href="/contact.html" class="font-bold text-xl text-slate-900">Contact</a>
        </div>
    </nav>

    <main class="container mx-auto px-6 py-12 md:py-24">
        <article class="max-w-4xl mx-auto">
            <!-- Back Link -->
            <a href="/blog.html" class="inline-flex items-center font-bold text-slate-900 hover:text-violet-500 mb-12 group transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2 group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back to Blog
            </a>

            <!-- Header -->
            <header class="mb-12">
                <div class="inline-block px-4 py-1 bg-yellow-400 border-2 border-slate-900 rounded-full text-xs font-black uppercase mb-6 shadow-[4px_4px_0px_0px_rgba(30,41,59,1)]">
                    {{CATEGORY}}
                </div>
                <h1 class="text-4xl md:text-6xl font-black text-slate-900 leading-tight mb-6">
                    {{TITLE}}
                </h1>
                <div class="flex items-center text-slate-500 font-bold">
                    <span>{{DATE}}</span>
                    <span class="mx-3">•</span>
                    <span>{{READ_TIME}}</span>
                </div>
            </header>

            <!-- Featured Image -->
            <div class="relative mb-16">
                <div class="absolute inset-0 bg-violet-500 border-4 border-slate-900 rounded-[40px] translate-x-4 translate-y-4 -z-10"></div>
                <div class="bg-white border-4 border-slate-900 rounded-[40px] overflow-hidden aspect-video shadow-hard">
                    <img src="{{IMAGE}}" alt="{{TITLE}}" class="w-full h-full object-cover">
                </div>
            </div>

            <!-- Content -->
            <div class="prose prose-slate prose-lg max-w-none
                prose-headings:font-black prose-headings:text-slate-900
                prose-p:text-slate-600 prose-p:font-medium prose-p:leading-relaxed
                prose-strong:text-slate-900 prose-strong:font-black
                prose-a:text-violet-500 prose-a:font-bold prose-a:no-underline hover:prose-a:underline
                prose-img:rounded-3xl prose-img:border-4 prose-img:border-slate-900 prose-img:shadow-hard">
                {{CONTENT}}
            </div>

            <!-- Share / Next Steps -->
            <div class="mt-20 p-12 bg-white border-4 border-slate-900 rounded-[40px] shadow-hard text-center">
                <h3 class="text-2xl font-black text-slate-900 mb-6">Liked this article?</h3>
                <p class="text-slate-600 font-bold mb-8">Share it with your network or let's discuss more on social media.</p>
                <div class="flex justify-center gap-4">
                    <a href="https://twitter.com/intent/tweet?text={{TITLE}}" target="_blank" class="w-12 h-12 flex items-center justify-center bg-white border-4 border-slate-900 rounded-xl shadow-[4px_4px_0px_0px_rgba(30,41,59,1)] hover:translate-x-1 hover:translate-y-1 hover:shadow-none transition-all">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.84 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>
                    </a>
                    <a href="https://www.linkedin.com/sharing/share-offsite/?url=" target="_blank" class="w-12 h-12 flex items-center justify-center bg-white border-4 border-slate-900 rounded-xl shadow-[4px_4px_0px_0px_rgba(30,41,59,1)] hover:translate-x-1 hover:translate-y-1 hover:shadow-none transition-all">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                    </a>
                </div>
            </div>
        </article>
    </main>

    <!-- Footer -->
    <footer class="py-12 border-t-4 border-slate-900 bg-white">
        <div class="container mx-auto px-6 text-center">
            <p class="font-bold text-slate-900">&copy; 2026 RdybMiharbi.</p>
        </div>
    </footer>
</body>
</html>
